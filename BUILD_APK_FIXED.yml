name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar projeto
        run: |
          # Se houver um zip com o projeto, descompacta no runner
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Garantir versão do Gradle compatível no wrapper (opcional)
        run: |
          # Se o projeto contém um gradle wrapper que aponta para uma versão não disponível (ex: 9.0), força para 8.7
          if [ -f VRBox_HOME_OS_FINAL_COMPLETE/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's#distributionUrl=.*#distributionUrl=https://services.gradle.org/distributions/gradle-8.7-bin.zip#g' VRBox_HOME_OS_FINAL_COMPLETE/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: '36.0.0'
          ndk: '27.2.12479018'

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure Gradle wrapper is executable
        run: |
          if [ -f ./VRBox_HOME_OS_FINAL_COMPLETE/gradlew ]; then
            chmod +x ./VRBox_HOME_OS_FINAL_COMPLETE/gradlew
          fi

      - name: Compilar APK
        working-directory: VRBox_HOME_OS_FINAL_COMPLETE
        run: |
          # Use o gradlew do projeto quando disponível (recomendado). Caso não exista, tenta usar gradle do sistema.
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Salvar APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: VRBox-Home-APK
          path: VRBox_HOME_OS_FINAL_COMPLETE/app/build/outputs/apk/debug/app-debug.apk
