name: Build APK - Fixed

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Descompactar projeto
        run: python unzip_files.py

      - name: Forçar versao compativel do Gradle no projeto
        run: |
          cd VRBox_HOME_OS_FINAL_COMPLETE
          # Modifica o arquivo de propriedades do gradle dentro do projeto para usar a versão 8.7 de forma segura
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's/distributionUrl=.*/distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: '36.0.0'
          ndk: '27.2.12479018'

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure Gradle wrapper is executable
        run: |
          if [ -f ./VRBox_HOME_OS_FINAL_COMPLETE/gradlew ]; then
            chmod +x ./VRBox_HOME_OS_FINAL_COMPLETE/gradlew
          fi

      - name: Build APK (assembleDebug)
        working-directory: VRBox_HOME_OS_FINAL_COMPLETE
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: VRBox-Home-APK
          path: VRBox_HOME_OS_FINAL_COMPLETE/app/build/outputs/apk/debug/app-debug.apk
